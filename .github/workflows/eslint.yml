name: ESLint

# Only run the workflow for pull requests
on: pull_request

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.ref}}
  cancel-in-progress: true

jobs:
  lint-js:
    name: JavaScript linting
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Get Node.js and npm version
        id: node-version
        run: |
          echo "NODE_VERSION=$(node -v)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache node_modules
        id: cache-node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: '**/node_modules'
          key: node_modules-${{ runner.os }}-${{ steps.node-version.outputs.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        if: ${{ steps.cache-node_modules.outputs.cache-hit != 'true' }}
        run: npm ci
        shell: bash

      - name: Lint JS files
        run: npm run lint
